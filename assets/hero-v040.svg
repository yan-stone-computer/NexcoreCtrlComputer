<svg width="1200" height="520" viewBox="0 0 1200 520" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="heroBg" x1="0" y1="0" x2="1200" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07111E"/>
      <stop offset="0.56" stop-color="#0A1D31"/>
      <stop offset="1" stop-color="#102A25"/>
    </linearGradient>
    <linearGradient id="heroFlow" x1="120" y1="260" x2="1075" y2="260" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4ADFFF"/>
