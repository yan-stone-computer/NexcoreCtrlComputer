<svg width="1400" height="820" viewBox="0 0 1400 820" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowDark" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M1 1L7.5 4.5L1 8V1Z" fill="#334155"/>
    </marker>
    <marker id="arrowBlue" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M1 1L7.5 4.5L1 8V1Z" fill="#2563EB"/>
    </marker>
    <marker id="arrowAmber" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M1 1L7.5 4.5L1 8V1Z" fill="#D97706"/>
    </marker>
  </defs>

  <rect width="1400" height="820" fill="#F8FAFC"/>
  <rect x="32" y="28" width="1336" height="764" rx="18" fill="#FFFFFF" stroke="#D8E0EA"/>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="58" y="72" fill="#64748B" font-size="12" font-weight="700" letter-spacing="1.7">SYSTEM ARCHITECTURE / V0.4</text>
    <text x="58" y="110" fill="#0F172A" font-size="30" font-weight="700">NexcoreCtrlComputer: unified desktop and browser control</text>
    <text x="58" y="138" fill="#64748B" font-size="15">A local semantic control plane with explicit routing, bounded observation, verified action, and layered Windows fallbacks.</text>
    <line x1="58" y1="160" x2="1342" y2="160" stroke="#D8E0EA"/>
  </g>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <rect x="58" y="194" width="220" height="102" rx="10" fill="#FFFFFF" stroke="#94A3B8"/>
    <text x="78" y="222" fill="#64748B" font-size="11" font-weight="700" letter-spacing="1.2">REQUEST</text>
    <text x="78" y="251" fill="#0F172A" font-size="19" font-weight="700">Agent intent</text>
    <text x="78" y="274" fill="#475569" font-size="12">JS · CLI · MCP</text>

    <rect x="334" y="194" width="242" height="102" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.4"/>
    <text x="354" y="222" fill="#2563EB" font-size="11" font-weight="700" letter-spacing="1.2">ROUTING</text>
    <text x="354" y="251" fill="#0F172A" font-size="19" font-weight="700">Surface router</text>
    <text x="354" y="274" fill="#475569" font-size="12">explicit desktop / browser state</text>

    <rect x="632" y="194" width="330" height="102" rx="10" fill="#FFFFFF" stroke="#94A3B8"/>
    <text x="652" y="222" fill="#64748B" font-size="11" font-weight="700" letter-spacing="1.2">CONTROL PIPELINE</text>
    <text x="652" y="251" fill="#0F172A" font-size="19" font-weight="700">Observe → Resolve → Act → Verify</text>
    <text x="652" y="274" fill="#475569" font-size="12">bounded state · fresh target · postcondition</text>

    <rect x="1018" y="194" width="324" height="102" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.4"/>
    <text x="1038" y="222" fill="#059669" font-size="11" font-weight="700" letter-spacing="1.2">OUTPUT</text>
    <text x="1038" y="251" fill="#0F172A" font-size="19" font-weight="700">Verified receipt</text>
    <text x="1038" y="274" fill="#475569" font-size="12">delivery · retry · evidence</text>

    <line x1="278" y1="245" x2="324" y2="245" stroke="#334155" stroke-width="1.5" marker-end="url(#arrowDark)"/>
    <line x1="576" y1="245" x2="622" y2="245" stroke="#2563EB" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
    <line x1="962" y1="245" x2="1008" y2="245" stroke="#334155" stroke-width="1.5" marker-end="url(#arrowDark)"/>
  </g>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="58" y="352" fill="#334155" font-size="12" font-weight="700" letter-spacing="1.3">EXECUTION BACKENDS</text>

    <rect x="58" y="378" width="292" height="150" rx="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.4"/>
    <text x="78" y="406" fill="#2563EB" font-size="11" font-weight="700">PRIMARY · DESKTOP</text>
    <text x="78" y="436" fill="#0F172A" font-size="19" font-weight="700">agent-desktop</text>
    <text x="78" y="464" fill="#475569" font-size="12">Accessibility tree, semantic refs,</text>
    <text x="78" y="483" fill="#475569" font-size="12">window management, text verification.</text>
    <text x="78" y="510" fill="#64748B" font-size="11">Preferred while available.</text>

    <rect x="378" y="378" width="292" height="150" rx="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.2" stroke-dasharray="5 5"/>
    <text x="398" y="406" fill="#2563EB" font-size="11" font-weight="700">FALLBACK · WINDOWS</text>
    <text x="398" y="436" fill="#0F172A" font-size="19" font-weight="700">Windows-MCP</text>
    <text x="398" y="464" fill="#475569" font-size="12">Application launch, desktop snapshot,</text>
    <text x="398" y="483" fill="#475569" font-size="12">labels, keyboard, mouse, wait states.</text>
    <text x="398" y="510" fill="#64748B" font-size="11">Used when the primary route fails.</text>

    <rect x="698" y="378" width="292" height="150" rx="10" fill="#FFFDF7" stroke="#D97706" stroke-width="1.4"/>
    <text x="718" y="406" fill="#D97706" font-size="11" font-weight="700">WEB SURFACE</text>
    <text x="718" y="436" fill="#0F172A" font-size="19" font-weight="700">agent-browser</text>
    <text x="718" y="464" fill="#475569" font-size="12">CDP session, selectors, semantic refs,</text>
    <text x="718" y="483" fill="#475569" font-size="12">navigation and browser postconditions.</text>
    <text x="718" y="510" fill="#64748B" font-size="11">Selected only by browser intent.</text>

    <rect x="1018" y="378" width="324" height="150" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.2"/>
    <text x="1038" y="406" fill="#64748B" font-size="11" font-weight="700">LAST RESORT · GUARDED</text>
    <text x="1038" y="436" fill="#0F172A" font-size="19" font-weight="700">PyAutoGUI</text>
    <text x="1038" y="464" fill="#475569" font-size="12">Coordinate input and screenshots for</text>
    <text x="1038" y="483" fill="#475569" font-size="12">canvas or unlabeled surfaces.</text>
    <text x="1038" y="510" fill="#64748B" font-size="11">Opt-in; disabled by default.</text>
  </g>

  <g>
    <path d="M455 296V340H204V368" stroke="#2563EB" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
    <path d="M455 340H844V368" stroke="#D97706" stroke-width="1.5" marker-end="url(#arrowAmber)"/>
    <path d="M350 453H368" stroke="#2563EB" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowBlue)"/>
    <text x="341" y="444" fill="#64748B" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9">fallback</text>
  </g>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <line x1="58" y1="572" x2="1342" y2="572" stroke="#D8E0EA"/>
    <text x="58" y="606" fill="#334155" font-size="12" font-weight="700" letter-spacing="1.3">ROUTING RULES</text>

    <text x="58" y="643" fill="#0F172A" font-size="14" font-weight="700">1</text>
    <text x="82" y="643" fill="#334155" font-size="14">Inventory view: windows, apps, displays, notifications, surfaces</text>
    <text x="760" y="643" fill="#2563EB" font-size="13" font-weight="600">→ desktop</text>

    <text x="58" y="681" fill="#0F172A" font-size="14" font-weight="700">2</text>
    <text x="82" y="681" fill="#334155" font-size="14">URL, browser action, browser selector</text>
    <text x="760" y="681" fill="#D97706" font-size="13" font-weight="600">→ browser</text>

    <text x="58" y="719" fill="#0F172A" font-size="14" font-weight="700">3</text>
    <text x="82" y="719" fill="#334155" font-size="14">App, window id/title, coordinate, or desktop accessibility ref</text>
    <text x="760" y="719" fill="#2563EB" font-size="13" font-weight="600">→ desktop</text>

    <rect x="1018" y="600" width="324" height="132" rx="10" fill="#F8FAFC" stroke="#CBD5E1"/>
    <text x="1040" y="628" fill="#64748B" font-size="11" font-weight="700">INVARIANT</text>
    <text x="1040" y="658" fill="#0F172A" font-size="17" font-weight="700">No implicit cross-surface switch</text>
    <text x="1040" y="684" fill="#475569" font-size="12">A prior browser session cannot capture</text>
    <text x="1040" y="704" fill="#475569" font-size="12">a later desktop inventory request.</text>
    <text x="1040" y="724" fill="#059669" font-size="11" font-weight="700">Ambiguous routes fail closed.</text>

    <text x="58" y="767" fill="#64748B" font-size="11">Core model: local target resolution + layered fallback + observable evidence. Screenshots and coordinates are not the default control path.</text>
  </g>
</svg>
