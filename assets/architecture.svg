  <text x="1032" y="147" fill="#FFDA83" font-family="Inter, Segoe UI, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">ADAPTIVE PERCEPTION</text>
  <text x="1032" y="181" fill="#FFF8E6" font-family="Inter, Segoe UI, sans-serif" font-size="24" font-weight="700">Target Resolver</text>
  <g font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="600">
    <rect x="1032" y="202" width="280" height="28" rx="8" fill="#1C2D20"/>
