<svg width="1400" height="760" viewBox="0 0 1400 760" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="archBg" x1="0" y1="0" x2="1400" y2="760" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07101D"/>
      <stop offset="0.52" stop-color="#0A1728"/>
      <stop offset="1" stop-color="#0D241B"/>
    </linearGradient>
    <linearGradient id="flow" x1="190" y1="160" x2="1160" y2="610" gradientUnits="userSpaceOnUse">
      <stop stop-color="#55E5FF"/>
      <stop offset="0.55" stop-color="#80FFB9"/>
      <stop offset="1" stop-color="#FFD16F"/>
    </linearGradient>
    <pattern id="archGrid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" stroke="#6AD9FF" stroke-opacity="0.055"/>
    </pattern>
    <filter id="archGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="8" refY="5.5" orient="auto">
      <path d="M1 1L9 5.5L1 10V1Z" fill="#77F3D1"/>
    </marker>
  </defs>

  <rect width="1400" height="760" rx="30" fill="url(#archBg)"/>
  <rect width="1400" height="760" rx="30" fill="url(#archGrid)"/>
  <circle cx="1300" cy="90" r="220" fill="#55FFB0" fill-opacity="0.055"/>
  <circle cx="95" cy="690" r="250" fill="#4CC9FF" fill-opacity="0.055"/>

  <g font-family="Inter, Segoe UI, sans-serif">
    <text x="58" y="64" fill="#F0FBFF" font-size="34" font-weight="720">Nexcore Semantic Program Architecture</text>
    <text x="59" y="96" fill="#8AE9F8" font-size="16" font-weight="500">The model sends intent once. The runtime owns resolution, safety, execution, and proof.</text>
  </g>

