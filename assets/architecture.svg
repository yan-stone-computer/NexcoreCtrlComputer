  <rect x="568" y="628" width="108" height="48" rx="12" fill="#2B1E12" stroke="#FFB868" stroke-opacity="0.48"/>
  <text x="588" y="649" fill="#FFD2A0" font-family="Inter, Segoe UI, sans-serif" font-size="12" font-weight="680">PyAutoGUI</text>
