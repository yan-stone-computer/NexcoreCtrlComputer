    <text x="817" y="234" fill="#80C9AA" font-size="11">allowlists</text>
    <rect x="678" y="255" width="112" height="42" rx="11" fill="#0B2A22" stroke="#5BEBB0" stroke-opacity="0.35"/>
    <text x="692" y="271" fill="#DFFFF1" font-weight="650">State</text>
    <text x="692" y="288" fill="#80C9AA" font-size="11">expect + retry</text>
    <rect x="803" y="255" width="113" height="42" rx="11" fill="#0B2A22" stroke="#5BEBB0" stroke-opacity="0.35"/>
    <text x="817" y="271" fill="#DFFFF1" font-weight="650">Results</text>
    <text x="817" y="288" fill="#80C9AA" font-size="11">compact proof</text>
