  <text x="74" y="279" fill="#8EAEC3" font-family="Inter, Segoe UI, sans-serif" font-size="13">one compact tool schema</text>
  <text x="74" y="298" fill="#8EAEC3" font-family="Inter, Segoe UI, sans-serif" font-size="13">program_run(name, params)</text>

  <path d="M284 219H350" stroke="url(#flow)" stroke-width="3.5" stroke-linecap="round" marker-end="url(#arrow)"/>

  <rect x="350" y="130" width="236" height="178" rx="22" fill="#0D2032" stroke="#4FE1C1" stroke-opacity="0.5"/>
  <text x="376" y="165" fill="#72FFD0" font-family="Inter, Segoe UI, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">PROGRAM PLANE</text>
  <text x="376" y="198" fill="#F0FFF9" font-family="Inter, Segoe UI, sans-serif" font-size="22" font-weight="680">Compiler</text>
  <text x="376" y="231" fill="#A7C9BE" font-family="Inter, Segoe UI, sans-serif" font-size="13">typed parameters + defaults</text>
  <text x="376" y="253" fill="#A7C9BE" font-family="Inter, Segoe UI, sans-serif" font-size="13">unsafe-field rejection</text>
  <text x="376" y="275" fill="#A7C9BE" font-family="Inter, Segoe UI, sans-serif" font-size="13">semantic locator contracts</text>
  <text x="376" y="297" fill="#A7C9BE" font-family="Inter, Segoe UI, sans-serif" font-size="13">digest + normalized steps</text>

