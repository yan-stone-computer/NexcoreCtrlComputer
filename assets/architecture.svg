  <rect x="48" y="690" width="1304" height="38" rx="12" fill="#FFFFFF" fill-opacity="0.045" stroke="#FFFFFF" stroke-opacity="0.08"/>
  <text x="70" y="714" fill="#9CC3C4" font-family="Inter, Segoe UI, sans-serif" font-size="12" font-weight="550">Invariant: no stored screenshots · no stored coordinates · no snapshot refs · no automatic pixels · no unsafe replay after delivery</text>
