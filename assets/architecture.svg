  <text x="74" y="198" fill="#EDFDFF" font-family="Inter, Segoe UI, sans-serif" font-size="22" font-weight="680">Agent / Harness</text>
  <g font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="550">
    <rect x="74" y="218" width="82" height="30" rx="15" fill="#10283C" stroke="#39C7ED" stroke-opacity="0.35"/>
    <text x="91" y="238" fill="#BFEFFF">MCP</text>
    <rect x="164" y="218" width="64" height="30" rx="15" fill="#10283C" stroke="#39C7ED" stroke-opacity="0.35"/>
    <text x="181" y="238" fill="#BFEFFF">JS</text>
    <rect x="236" y="218" width="30" height="30" rx="15" fill="#10283C" stroke="#39C7ED" stroke-opacity="0.35"/>
    <text x="245" y="238" fill="#BFEFFF">C</text>
