  <g font-family="Inter, Segoe UI, sans-serif">
    <text x="54" y="62" fill="#F2FDFF" font-size="34" font-weight="730">Control plane, not a screenshot loop</text>
    <text x="55" y="94" fill="#8AE8F8" font-size="16" font-weight="500">Observe the smallest useful state. Resolve a fresh target. Act. Verify. Return one receipt.</text>
  </g>

