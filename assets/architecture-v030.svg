  <text x="396" y="182" fill="#F3FFF9" font-family="Inter, Segoe UI, sans-serif" font-size="24" font-weight="720">Explicit state machine</text>
  <g font-family="Inter, Segoe UI, sans-serif" font-size="13">
    <text x="396" y="214" fill="#B3DED0">surface=browser + url → browser</text>
    <text x="396" y="240" fill="#B3DED0">app / windowId / @live ref → desktop</text>
    <text x="396" y="266" fill="#B3DED0">windows · apps · displays → desktop</text>
    <text x="396" y="292" fill="#FFD36B" font-weight="700">previous browser session never wins</text>
  </g>

